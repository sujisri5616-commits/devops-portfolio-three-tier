services:

  mongodb:
    image: mongo:7
    container_name: portfolio-mongodb
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    networks:
      - portfolio-network

  backend:
    build:
      context: ./backend
    container_name: portfolio-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017/portfolio
      PORT: 5000
    depends_on:
      - mongodb
    networks:
      - portfolio-network

  frontend:
    build:
      context: ./frontend
    container_name: portfolio-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - portfolio-network

volumes:
  mongo-data:

networks:
  portfolio-network:
    driver: bridge
